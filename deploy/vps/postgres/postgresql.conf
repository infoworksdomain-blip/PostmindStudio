# PostMind Studio — Postgres 17 settings for the single-server deployment (deploy/vps/compose.yml).
#
# Mounted as config_file (postgres image docs: "must set listen_addresses = '*'",
# github.com/docker-library/docs postgres/content.md, read 2026-09-29). The memory settings
# (shared_buffers, effective_cache_size, work_mem, maintenance_work_mem, max_connections) and
# archive_mode are passed as -c flags from the env file instead, so staging and a bigger server
# can use other values without editing this file. -c overrides this file.
#
# Default sizing (the -c defaults in compose.yml) is for a 2 GB server running everything:
# shared_buffers 96MB, effective_cache_size 512MB, work_mem 4MB, maintenance_work_mem 64MB,
# max_connections 40 (web 5 + worker 10 + migrate 2 + ops 5 + pgBackRest + psql; each Prisma pool
# is capped by connection_limit in DATABASE_URL). On a dedicated database server the docs' starting
# point for shared_buffers is 25% of RAM (https://www.postgresql.org/docs/17/runtime-config-resource.html,
# read 2026-09-29); here Postgres shares 2 GB with Node and FFmpeg, so it gets less.

listen_addresses = '*'
port = 5432

# ---- WAL and continuous archiving (https://www.postgresql.org/docs/17/continuous-archiving.html)
wal_level = replica
# archive_mode comes from PG_BACKUPS (on | off) in the env file.
# pgBackRest's documented form (https://pgbackrest.org/user-guide.html "Configure Archiving"); the
# stanza and the repository come from PGBACKREST_* in the container environment.
archive_command = 'pgbackrest --stanza=studio archive-push %p'
# Force a WAL segment switch at least every minute when there were writes, so the recovery point
# is at most about a minute old. "archive_timeout settings of a minute or so are usually
# reasonable" (same docs page).
archive_timeout = 60
wal_compression = on
max_wal_size = 1GB
min_wal_size = 80MB
checkpoint_completion_target = 0.9

# ---- Planner (NVMe local disk)
random_page_cost = 1.1
effective_io_concurrency = 200

# ---- One shared vCPU on the smallest server: no parallel query workers (each would also take
# work_mem). Raise with the server size.
max_parallel_workers_per_gather = 0
max_parallel_maintenance_workers = 1

# ---- Autovacuum: keep the defaults but log slow runs.
log_autovacuum_min_duration = 10s

# ---- Logging to stderr (docker logs, rotated by the json-file log options).
log_min_duration_statement = 2s
log_checkpoints = on
log_lock_waits = on
log_temp_files = 10MB
log_timezone = 'UTC'
timezone = 'UTC'
