# PostMind Studio — Prometheus for the single-server deployment (deploy/vps/compose.yml, profile
# monitoring). Same job names as ops/prometheus/prometheus.yml, which the alert rules use:
#   studio-web        GET /api/metrics on the web container      (Bearer METRICS_TOKEN)
#   studio-worker     GET :9464/metrics on the worker container  (Bearer METRICS_TOKEN)
#   studio-readiness  blackbox http_2xx probe of /api/health/ready
# Service names resolve through Docker's embedded DNS inside the compose project. When the worker
# is split into more services (compose.yml STUDIO_WORKER_QUEUES), add their names below.
# Unlike docker-compose.monitoring.yml's config, the SLO rules are loaded too (as on Render).
# No secret in this file: the token is read from the mounted secret file.

global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    service: postmind-studio

rule_files:
  - /etc/prometheus/rules/studio-alerts.yml
  - /etc/prometheus/rules/studio-slo.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: studio-web
    metrics_path: /api/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics-token
    dns_sd_configs:
      - names: ['web']
        type: A
        port: 3010
        refresh_interval: 30s

  - job_name: studio-worker
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics-token
    dns_sd_configs:
      - names: ['worker']
        type: A
        port: 9464
        refresh_interval: 30s

  - job_name: studio-readiness
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://web:3010/api/health/ready']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']
