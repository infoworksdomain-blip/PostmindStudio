# PostMind Studio — production topology (BACKLOG 12.6). Single-host reference / staging layout;
# the same services map 1:1 onto ECS or Kubernetes deployments (playbook 7.3 sizing).
#
# Postgres (studio schema + pgvector) and Redis (DB 3) are MANAGED services shared with PostMind
# Core — they are deliberately not defined here. Secrets come from the secret manager, rendered to
# the env file below at deploy time (never committed; see runbooks/deploy.md).
#
#   IMAGE_TAG=<git-sha> docker compose -f docker-compose.prod.yml run --rm migrate
#   IMAGE_TAG=<git-sha> docker compose -f docker-compose.prod.yml up -d --no-deps web worker-orchestration ...

x-studio: &studio
  image: ${STUDIO_IMAGE:-ghcr.io/infoworksdomain-blip/postmind-studio}:${IMAGE_TAG:?set IMAGE_TAG to the git SHA being deployed}
  env_file: ${STUDIO_ENV_FILE:-.env.production}
  restart: unless-stopped
  stop_grace_period: 120s # workers finish in-flight jobs on SIGTERM (scripts/worker.ts)
  logging:
    driver: json-file
    options: { max-size: '50m', max-file: '5' }

x-worker: &worker
  <<: *studio
  healthcheck:
    disable: true # no HTTP listener; liveness = BullMQ stalled-job detection + /metrics scrape

services:
  # One-shot: apply committed migrations (forward-only, expand/contract — runbooks/rollback.md)
  # then the idempotent seed (system_flags, presets, templates, taxonomy).
  migrate:
    <<: *studio
    restart: 'no'
    command: ['sh', '-c', 'npx prisma migrate deploy && npx prisma db seed']
    profiles: ['migrate']

  web:
    <<: *studio
    command: ['npx', 'next', 'start', '-p', '3010']
    # Fronted by the load balancer (TLS, studio.postmind.ai); health: /api/health, ready: /api/health/ready.
    expose: ['3010']
    deploy:
      replicas: 3

  # Queue-per-service so each scales independently (spec 11.3; playbook 7.3 pod counts).
  worker-orchestration:
    <<: *worker
    command: ['npx', 'tsx', 'scripts/worker.ts', 'studio-orchestration']
    deploy: { replicas: 3 }

  worker-assets:
    <<: *worker
    command: ['npx', 'tsx', 'scripts/worker.ts', 'studio-assets']
    deploy: { replicas: 5 }
    # 14.4: website scans run here; the headless network reaches only the browserless service.
    networks: [default, headless]

  worker-publish:
    <<: *worker
    command: ['npx', 'tsx', 'scripts/worker.ts', 'studio-publish']
    deploy: { replicas: 3 }

  worker-scheduled:
    <<: *worker
    command: ['npx', 'tsx', 'scripts/worker.ts', 'studio-scheduled']
    deploy: { replicas: 2 }

  worker-analytics:
    <<: *worker
    command: ['npx', 'tsx', 'scripts/worker.ts', 'studio-analytics']
    deploy: { replicas: 2 }

  # Feature A corpus ingestion — staff-triggered batches, isolated from customer queues.
  worker-library:
    <<: *worker
    command: ['npx', 'tsx', 'scripts/worker.ts', 'studio-library']
    deploy: { replicas: 1 }

  # BACKLOG 14.4 — headless render service for website scans whose homepage is refused by bot
  # protection (HTTP 403/429/503), used ONLY for sites the business owner confirmed they own
  # (website_scans.ownershipConfirmedAt; scan worker headlessFor()). Never a way round a third
  # party's bot protection: no CAPTCHA solving, no proxy rotation (runbooks/scan-blocked.md).
  # Off unless the profile is enabled:
  #   docker compose -p postmind-studio -f docker-compose.prod.yml --profile headless-render up -d browserless
  # and the workers get STUDIO_HEADLESS_RENDER_URL=http://browserless:3000 plus
  # STUDIO_HEADLESS_RENDER_TOKEN = the same token as the file below (sent as Authorization: Bearer).
  # Image: the open-source Browserless Chromium build, pinned (github.com/browserless/browserless
  # release v2.56.7, ghcr.io/browserless/chromium:<tag>); it reads its token from the TOKEN env var
  # (src/config.ts), so the entrypoint loads it from the secret file instead of an env file. It is
  # on its own network with worker-assets only, so the browser cannot reach web or other services.
  browserless:
    image: ghcr.io/browserless/chromium:v2.56.7
    profiles: ['headless-render']
    restart: unless-stopped
    entrypoint: ['sh', '-c']
    command: ['export TOKEN="$$(cat /run/secrets/browserless_token)" && exec ./scripts/start.sh']
    environment:
      CONCURRENT: '2'
      QUEUE_LENGTH: '10'
      TIMEOUT: '45000'
    secrets: [browserless_token]
    expose: ['3000']
    networks: [headless]
    logging:
      driver: json-file
      options: { max-size: '50m', max-file: '5' }

networks:
  default:
  headless:

secrets:
  browserless_token:
    file: ${BROWSERLESS_TOKEN_FILE:-./secrets/browserless-token}
