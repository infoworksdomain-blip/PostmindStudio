name: Daily platform and provider canary

# BACKLOG 13.31 — one live, read-only API call per platform with a sandbox account
# (src/lib/studio/platforms/canary.ts), to catch token/permission loss and response-shape changes
# before customers do (runbooks/platform-api-change.md). Platforms without secrets are skipped;
# with no secrets at all the job skips with a notice.

on:
  schedule:
    - cron: '30 5 * * *' # daily 05:30 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CANARY_YOUTUBE_ACCESS_TOKEN: ${{ secrets.CANARY_YOUTUBE_ACCESS_TOKEN }}
      CANARY_TIKTOK_ACCESS_TOKEN: ${{ secrets.CANARY_TIKTOK_ACCESS_TOKEN }}
      CANARY_X_ACCESS_TOKEN: ${{ secrets.CANARY_X_ACCESS_TOKEN }}
      CANARY_LINKEDIN_ACCESS_TOKEN: ${{ secrets.CANARY_LINKEDIN_ACCESS_TOKEN }}
      CANARY_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.CANARY_INSTAGRAM_ACCESS_TOKEN }}
      CANARY_INSTAGRAM_USER_ID: ${{ secrets.CANARY_INSTAGRAM_USER_ID }}
      CANARY_FACEBOOK_PAGE_TOKEN: ${{ secrets.CANARY_FACEBOOK_PAGE_TOKEN }}
      CANARY_FACEBOOK_VIDEO_ID: ${{ secrets.CANARY_FACEBOOK_VIDEO_ID }}
      META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION }}
    steps:
      - name: Check for sandbox secrets
        id: secrets
        run: |
          if [ -n "$CANARY_YOUTUBE_ACCESS_TOKEN$CANARY_TIKTOK_ACCESS_TOKEN$CANARY_X_ACCESS_TOKEN$CANARY_LINKEDIN_ACCESS_TOKEN$CANARY_INSTAGRAM_ACCESS_TOKEN$CANARY_FACEBOOK_PAGE_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Platform canary skipped::No CANARY_* sandbox secrets are configured. Add them in Settings → Secrets (runbooks/platform-api-change.md)."
          fi
      - uses: actions/checkout@v7
        if: steps.secrets.outputs.present == 'true'
      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.present == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.secrets.outputs.present == 'true'
      - name: Live read-only canary per configured platform
        if: steps.secrets.outputs.present == 'true'
        env:
          CANARY_ANNOTATIONS_FILE: ${{ runner.temp }}/platform-deprecations.txt
        run: npx vitest run --config vitest.canary.config.ts test/canary/platform.canary.ts
      - name: Deprecation / Sunset headers seen (15.D10)
        if: always() && steps.secrets.outputs.present == 'true'
        run: cat "${{ runner.temp }}/platform-deprecations.txt" 2>/dev/null || true

  providers:
    # BACKLOG 15.D10 / spec §20 "Every adapter has integration tests run daily … staging
    # environment monitors deprecation warnings": each AI provider adapter's own read-only
    # healthCheck() with a STAGING key (src/lib/studio/providers/canary.ts,
    # test/canary/providers.canary.ts). Deprecation / Sunset / Link rel=deprecation response
    # headers become ::warning annotations. Providers without secrets are skipped.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CANARY_ANTHROPIC_API_KEY: ${{ secrets.CANARY_ANTHROPIC_API_KEY }}
      CANARY_OPENAI_API_KEY: ${{ secrets.CANARY_OPENAI_API_KEY }}
      CANARY_RUNWAY_API_KEY: ${{ secrets.CANARY_RUNWAY_API_KEY }}
      CANARY_LUMA_API_KEY: ${{ secrets.CANARY_LUMA_API_KEY }}
      CANARY_GOOGLE_GEMINI_API_KEY: ${{ secrets.CANARY_GOOGLE_GEMINI_API_KEY }}
      CANARY_HEYGEN_API_KEY: ${{ secrets.CANARY_HEYGEN_API_KEY }}
      CANARY_HEYGEN_AVATAR_ID: ${{ secrets.CANARY_HEYGEN_AVATAR_ID }}
      CANARY_ELEVENLABS_API_KEY: ${{ secrets.CANARY_ELEVENLABS_API_KEY }}
      CANARY_SHOTSTACK_API_KEY: ${{ secrets.CANARY_SHOTSTACK_API_KEY }}
      CANARY_ASSEMBLYAI_API_KEY: ${{ secrets.CANARY_ASSEMBLYAI_API_KEY }}
      CANARY_STORYBLOCKS_PUBLIC_KEY: ${{ secrets.CANARY_STORYBLOCKS_PUBLIC_KEY }}
      CANARY_STORYBLOCKS_PRIVATE_KEY: ${{ secrets.CANARY_STORYBLOCKS_PRIVATE_KEY }}
    steps:
      - name: Check for staging provider secrets
        id: secrets
        run: |
          if [ -n "$CANARY_ANTHROPIC_API_KEY$CANARY_OPENAI_API_KEY$CANARY_RUNWAY_API_KEY$CANARY_LUMA_API_KEY$CANARY_GOOGLE_GEMINI_API_KEY$CANARY_HEYGEN_API_KEY$CANARY_ELEVENLABS_API_KEY$CANARY_SHOTSTACK_API_KEY$CANARY_ASSEMBLYAI_API_KEY$CANARY_STORYBLOCKS_PUBLIC_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Provider canary skipped::No CANARY_* staging provider secrets are configured (runbooks/slo-and-launch-readiness.md)."
          fi
      - uses: actions/checkout@v7
        if: steps.secrets.outputs.present == 'true'
      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.present == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.secrets.outputs.present == 'true'
      - name: Live health check per configured provider
        if: steps.secrets.outputs.present == 'true'
        env:
          CANARY_ANNOTATIONS_FILE: ${{ runner.temp }}/provider-annotations.txt
        run: npx vitest run --config vitest.canary.config.ts test/canary/providers.canary.ts
      - name: Deprecation / Sunset headers and unprobed providers
        if: always() && steps.secrets.outputs.present == 'true'
        run: cat "${{ runner.temp }}/provider-annotations.txt" 2>/dev/null || true
