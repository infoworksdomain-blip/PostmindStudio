name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:validate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  database:
    # Applies the committed migrations to real Postgres 15 + pgvector, seeds system_flags,
    # and fails if prisma/schema.prisma has drifted from prisma/migrations.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: studio
          POSTGRES_DB: postmind
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U studio -d postmind"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379/3
      DATABASE_URL: postgresql://studio:studio@localhost:5432/postmind?schema=studio
      SHADOW_DATABASE_URL: postgresql://studio:studio@localhost:5432/shadow?schema=studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - name: Seed is idempotent
        run: npx prisma db seed
      - name: All tables are in the studio schema
        run: |
          count=$(PGPASSWORD=studio psql -h localhost -U studio -d postmind -tAc \
            "SELECT count(*) FROM pg_tables WHERE schemaname = 'studio' AND tablename <> '_prisma_migrations'")
          echo "studio tables: $count"
          # 33 (spec 7 + A7) + cost_alerts + notifications (Phase 12 cost caps / alerting)
          test "$count" -eq 46
      - name: Install ffmpeg (Ubuntu repository)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Full suite with coverage on real Postgres, BullMQ (Redis 7) and ffmpeg
        # Coverage is enforced here, where the DB/queue/media suites run too.
        run: npm run test:coverage
      - name: Schema matches migrations (drift check)
        run: |
          PGPASSWORD=studio psql -h localhost -U studio -d postmind -c 'CREATE DATABASE shadow'
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code

  ops-config:
    # Phase 12 alerting: Prometheus rules parse and behave (promtool unit tests), and the
    # Alertmanager routing is valid and sends each severity to the right receiver.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: promtool check rules
        run: >-
          docker run --rm -v "$PWD/ops:/ops" --entrypoint promtool prom/prometheus:v2.55.1
          check rules /ops/prometheus/studio-alerts.yml /ops/prometheus/studio-slo.yml
      - name: promtool test rules
        run: >-
          docker run --rm -v "$PWD/ops:/ops" --entrypoint promtool prom/prometheus:v2.55.1
          test rules /ops/prometheus/tests/studio-alerts.test.yml
          /ops/prometheus/tests/studio-slo.test.yml
      - name: amtool check-config
        run: >-
          docker run --rm -v "$PWD/ops:/ops" --entrypoint amtool prom/alertmanager:v0.28.1
          check-config /ops/alertmanager/alertmanager.yml
      - name: Routing sends page → PagerDuty, ticket → Slack
        run: |
          for pair in "severity=page:studio-page" "severity=ticket:studio-ticket"; do
            docker run --rm -v "$PWD/ops:/ops" --entrypoint amtool prom/alertmanager:v0.28.1 \
              config routes test --config.file=/ops/alertmanager/alertmanager.yml \
              --verify.receivers="${pair#*:}" alertname=CiRoutingCheck "${pair%%:*}"
          done

  docker:
    # BACKLOG 12.6 — the production image builds, runs as non-root with ffmpeg present, serves
    # /api/health, and docker-compose.prod.yml is valid.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t postmind-studio:ci .
      - name: Image has ffmpeg, runs as node
        run: |
          docker run --rm --entrypoint sh postmind-studio:ci -c 'ffmpeg -version | head -1 && ffprobe -version | head -1 && test "$(id -un)" = node'
      - name: Liveness responds
        run: |
          docker run -d --name studio -p 3010:3010 postmind-studio:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3010/api/health; then exit 0; fi
            sleep 2
          done
          docker logs studio
          exit 1
      - name: Compose file is valid
        run: |
          touch .env.production
          IMAGE_TAG=ci docker compose -f docker-compose.prod.yml config --quiet
          IMAGE_TAG=ci docker compose -f docker-compose.prod.yml --profile migrate config --quiet
