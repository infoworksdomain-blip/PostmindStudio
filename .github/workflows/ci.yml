name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:validate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # Phase 16: every locale has every key, and screens use logical (RTL-safe) CSS only.
      - run: npx tsx scripts/i18n/check-catalogues.ts
      - run: npx tsx scripts/i18n/check-physical-css.ts --fail
      # Phase 17.7: render.yaml against Render's published Blueprint JSON Schema (pinned copy in
      # ops/render/render.yaml.schema.json, the file SchemaStore's "Render Blueprints" entry serves).
      - name: render.yaml matches Render's Blueprint schema
        run: npx tsx scripts/render/validate-blueprint.ts render.yaml
      - run: npm test

  database:
    # Applies the committed migrations to real Postgres 17 + pgvector (the major render.yaml pins
    # for Render Postgres, Phase 17.7), seeds system_flags, and fails if prisma/schema.prisma has
    # drifted from prisma/migrations.
    runs-on: ubuntu-latest
    timeout-minutes: 25 # the suite passed 15 min as Phase 20 added DB-backed tests (cancelled runs, 2026-10-01)
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: studio
          POSTGRES_DB: postmind
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U studio -d postmind"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379/3
      DATABASE_URL: postgresql://studio:studio@localhost:5432/postmind?schema=studio
      SHADOW_DATABASE_URL: postgresql://studio:studio@localhost:5432/shadow?schema=studio
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - name: Seed is idempotent
        run: npx prisma db seed
      - name: All tables are in the studio schema
        run: |
          count=$(PGPASSWORD=studio psql -h localhost -U studio -d postmind -tAc \
            "SELECT count(*) FROM pg_tables WHERE schemaname = 'studio' AND tablename <> '_prisma_migrations'")
          echo "studio tables: $count"
          # 33 (spec 7 + A7) + cost_alerts + notifications (Phase 12 cost caps / alerting)
          # + content_plans + content_plan_items (Phase 20.9 "Plan my month")
          # + business_hashtag_settings (Phase 20.13 captions and hashtags)
          test "$count" -eq 81
      - name: Install ffmpeg (Ubuntu repository)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Full suite with coverage on real Postgres, BullMQ (Redis 7) and ffmpeg
        # Coverage is enforced here, where the DB/queue/media suites run too.
        run: npm run test:coverage
      - name: Schema matches migrations (drift check)
        run: |
          PGPASSWORD=studio psql -h localhost -U studio -d postmind -c 'CREATE DATABASE shadow'
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code

  ops-config:
    # Phase 12 alerting: Prometheus rules parse and behave (promtool unit tests), and the
    # Alertmanager routing is valid and sends each severity to the right receiver.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: promtool check rules
        run: >-
          docker run --rm -v "$PWD/ops:/ops" --entrypoint promtool prom/prometheus:v2.55.1
          check rules /ops/prometheus/studio-alerts.yml /ops/prometheus/studio-slo.yml
      - name: promtool test rules
        run: >-
          docker run --rm -v "$PWD/ops:/ops" --entrypoint promtool prom/prometheus:v2.55.1
          test rules /ops/prometheus/tests/studio-alerts.test.yml
          /ops/prometheus/tests/studio-slo.test.yml
      - name: promtool check config (docker-compose.monitoring.yml layout)
        # BACKLOG 14.3: the rule file and the metrics token are mounted where prometheus.yml reads
        # them; the token here is a placeholder file, never a real secret.
        run: |
          printf 'ci-placeholder' > "$RUNNER_TEMP/metrics-token"
          docker run --rm \
            -v "$PWD/ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/ops/prometheus/studio-alerts.yml:/etc/prometheus/rules/studio-alerts.yml:ro" \
            -v "$RUNNER_TEMP/metrics-token:/etc/prometheus/secrets/metrics-token:ro" \
            --entrypoint promtool prom/prometheus:v2.55.1 check config /etc/prometheus/prometheus.yml
      - name: amtool check-config
        run: >-
          docker run --rm -v "$PWD/ops:/ops" --entrypoint amtool prom/alertmanager:v0.28.1
          check-config /ops/alertmanager/alertmanager.yml
      - name: Routing sends page → PagerDuty, ticket → Slack
        run: |
          for pair in "severity=page:studio-page" "severity=ticket:studio-ticket"; do
            docker run --rm -v "$PWD/ops:/ops" --entrypoint amtool prom/alertmanager:v0.28.1 \
              config routes test --config.file=/ops/alertmanager/alertmanager.yml \
              --verify.receivers="${pair#*:}" alertname=CiRoutingCheck "${pair%%:*}"
          done

  docker:
    # BACKLOG 12.6 — the production image builds, runs as non-root with ffmpeg present, serves
    # /api/health, and docker-compose.prod.yml is valid.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t postmind-studio:ci .
      - name: Image has ffmpeg, runs as node
        run: |
          docker run --rm --entrypoint sh postmind-studio:ci -c 'ffmpeg -version | head -1 && ffprobe -version | head -1 && test "$(id -un)" = node'
      - name: Liveness responds
        run: |
          # Standalone mode refuses to start without its required settings (src/lib/env.ts
          # assertStartupEnv), so liveness runs with placeholders. /api/health touches no dependency.
          docker run -d --name studio -p 3010:3010 \
            -e DATABASE_URL='postgresql://ci:ci@127.0.0.1:5432/ci?schema=studio' \
            -e APP_URL='http://localhost:3010' \
            -e BETTER_AUTH_SECRET="$(openssl rand -hex 32)" \
            -e STRIPE_SECRET_KEY='sk_test_ci_placeholder' \
            -e STRIPE_WEBHOOK_SECRET='whsec_ci_placeholder' \
            -e RESEND_API_KEY='re_ci_placeholder' \
            -e RESEND_WEBHOOK_SECRET='whsec_ci_placeholder' \
            -e STUDIO_EMAIL_FROM='PostMind Studio <no-reply@ci.invalid>' \
            -e STUDIO_UNSUBSCRIBE_SECRET="$(openssl rand -hex 32)" \
            postmind-studio:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3010/api/health; then exit 0; fi
            sleep 2
          done
          docker logs studio
          exit 1
      - name: Render monitoring image builds (ops/render/monitoring, Phase 17.7)
        # Same build context as render.yaml (dockerContext "."). Checks the binaries it copies
        # from the pinned upstream images exist and the rules/config land where prometheus.yml.tmpl
        # reads them.
        run: |
          docker build -f ops/render/monitoring/Dockerfile -t studio-monitoring:ci .
          docker run --rm --entrypoint sh studio-monitoring:ci -c '
            /bin/prometheus --version && /bin/alertmanager --version && /bin/blackbox_exporter --version &&
            promtool check rules /etc/prometheus/rules/studio-alerts.yml /etc/prometheus/rules/studio-slo.yml &&
            test -f /etc/prometheus/prometheus.yml.tmpl && test -f /usr/local/bin/studio-monitoring'
      - name: Compose file is valid
        run: |
          touch .env.production
          # Compose resolves secret file paths; the browserless token is a deploy-host file.
          mkdir -p secrets && touch secrets/browserless-token
          IMAGE_TAG=ci docker compose -f docker-compose.prod.yml config --quiet
          IMAGE_TAG=ci docker compose -f docker-compose.prod.yml --profile migrate config --quiet
      # Deployment: single VPS — the same image runs the VPS stack (deploy/vps/compose.yml): migrate,
      # then web answers /api/health/ready against the stack's own Postgres 17 + pgvector and
      # Valkey, and the worker's `node --import tsx` entry point loads. Placeholder env only.
      - name: VPS stack smoke (deploy/vps/compose.yml)
        run: |
          eval "$(bash scripts/vps/ci-fixture.sh "$RUNNER_TEMP/vps")"
          # Shell variables win over --env-file values: use the image built above.
          export IMAGE_TAG=ci STUDIO_IMAGE=postmind-studio
          vps() {
            docker compose -p postmind-studio -f deploy/vps/compose.yml \
              --env-file "$STUDIO_ENV_FILE" --env-file "$STUDIO_BACKUP_ENV_FILE" "$@"
          }
          docker network create studio-edge
          vps build postgres
          vps up -d --wait --wait-timeout 180 postgres redis
          vps --profile migrate run --rm migrate
          vps up -d --no-deps --wait --wait-timeout 240 web
          vps exec -T web node -e "fetch('http://127.0.0.1:3010/api/health/ready').then(async r=>{console.log(r.status, await r.text());process.exit(r.ok?0:1)})"
          # The real worker process: it must start (healthcheck = its metrics listener) and log
          # every queue it consumes. The expected list is compose's default, which
          # test/unit/vps-compose.test.ts keeps equal to QUEUES in src/lib/studio/queue/queues.ts.
          vps up -d --no-deps --wait --wait-timeout 180 worker
          started="$(vps logs worker | grep 'studio workers started' | tail -n 1)"
          echo "$started"
          for q in studio-orchestration studio-assets studio-publish studio-scheduled studio-analytics studio-library; do
            printf '%s' "$started" | grep -q "\"$q\"" || { echo "worker does not consume $q"; exit 1; }
          done
          vps exec -T redis valkey-cli CONFIG GET maxmemory-policy | grep -qx noeviction
          vps exec -T redis valkey-cli CONFIG GET appendonly | grep -qx yes
          vps exec -T -u postgres postgres psql -U studio -d postmind_studio -tAc \
            "select extversion from pg_extension where extname = 'vector'"
          vps exec -T -u postgres postgres pgbackrest version
      - name: VPS stack logs
        if: failure()
        run: |
          docker ps -a
          for c in $(docker ps -aq --filter label=com.docker.compose.project=postmind-studio); do
            echo "--- $c"; docker logs --tail 80 "$c" || true
          done

  e2e:
    # Phase 18 Track E — Playwright happy path against the real app in standalone mode:
    # landing → pricing → sign-up → onboarding → first project (e2e/happy-path.spec.ts). It needs
    # Track A's sign-up / sign-in screens and Track C's pricing page; until both are on the branch
    # the job skips with a notice (the same pattern as the overlay pixel diff), then runs itself.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: studio
          POSTGRES_DB: postmind
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U studio -d postmind"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://studio:studio@localhost:5432/postmind?schema=studio
      REDIS_URL: redis://localhost:6379/3
      STUDIO_MODE: standalone
      APP_URL: http://127.0.0.1:3102
      BETTER_AUTH_URL: http://127.0.0.1:3102
      E2E_BASE_URL: http://127.0.0.1:3102
      E2E_START: '1'
      # CI-only placeholders (not secrets): Stripe and Resend are never called on this path;
      # sign-up email is replaced by marking the user verified in the database.
      BETTER_AUTH_SECRET: ci-e2e-placeholder-secret-0123456789abcdef
      STUDIO_UNSUBSCRIBE_SECRET: ci-e2e-placeholder-unsubscribe-0123456789ab
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      STUDIO_EMAIL_PROVIDER: none
      # next start runs with NODE_ENV=production, where sign-up stays closed while the terms or
      # privacy text is a placeholder (src/lib/legal/readiness.ts). CI reads stand-in texts instead.
      STUDIO_LEGAL_CONTENT_DIR: /tmp/e2e-legal
      # Loaded with the shared API deps on every route (storage, cost). Placeholders: the happy path
      # uploads nothing, and generation stops at the billing gate before any provider call.
      AWS_REGION: eu-west-2
      S3_BUCKET_ASSETS: ci-assets
      S3_BUCKET_RENDERS: ci-renders
      S3_BUCKET_THUMBNAILS: ci-thumbnails
      S3_BUCKET_LIBRARY: ci-library
      # Placeholders (not secrets) so the QA sweep (e2e/sweep.spec.ts) can presign preview URLs
      # offline for its seeded library reference; nothing is uploaded or fetched from S3.
      AWS_ACCESS_KEY_ID: ci-placeholder
      AWS_SECRET_ACCESS_KEY: ci-placeholder
      STUDIO_USD_TO_GBP_RATE: '0.79'
      # QA specs (e2e/qa): object storage is a local stub (e2e/qa/s3-stub.mjs), never a real bucket.
      AWS_ENDPOINT_URL_S3: http://127.0.0.1:3199
    steps:
      - uses: actions/checkout@v7
      - name: Stand-in legal texts (CI only)
        run: |
          mkdir -p /tmp/e2e-legal/en-GB
          for doc in terms privacy cookies acceptable-use dpa subprocessors; do
            printf '# CI stand-in\n\nNot legal text: used only by the CI end-to-end test.\n' > "/tmp/e2e-legal/en-GB/$doc.md"
          done
      - name: Track A and C screens present?
        id: ready
        run: |
          if [ -f 'src/app/(auth)/sign-up/page.tsx' ] && [ -f 'src/app/(marketing)/pricing/page.tsx' ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=E2E happy path skipped::Needs Track A sign-up and Track C pricing pages on this branch."
          fi
      - uses: actions/setup-node@v7
        if: steps.ready.outputs.present == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.ready.outputs.present == 'true'
      - run: npx prisma migrate deploy && npx prisma db seed
        if: steps.ready.outputs.present == 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.ready.outputs.present == 'true'
      - run: npm run build
        if: steps.ready.outputs.present == 'true'
      - run: npx playwright test
        if: steps.ready.outputs.present == 'true'
        env:
          # e2e/qa/library-templates.spec.ts: library search and recommendations embed text; the
          # preload answers those OpenAI calls offline (no paid API, no secret).
          OPENAI_API_KEY: ci-placeholder
          QA_EMBEDDING_STUB: '1'
          NODE_OPTIONS: --require ./e2e/qa/embedding-stub.cjs
      - uses: actions/upload-artifact@v7
        if: failure() && steps.ready.outputs.present == 'true'
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  vps-config:
    # Deployment: single VPS — shell scripts (shellcheck is on the ubuntu runners; not available
    # on the build machine), both compose files resolve with the committed examples, Caddy accepts
    # the generated site, and Prometheus accepts the VPS scrape config with the repo's rules.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck --version && shellcheck -x scripts/vps/*.sh deploy/vps/bootstrap.sh
      - name: docker compose config (app stack, every profile, and the edge)
        run: |
          eval "$(bash scripts/vps/ci-fixture.sh "$RUNNER_TEMP/vps")"
          export IMAGE_TAG=ci
          for profiles in "" "--profile migrate --profile ops --profile restore" "--profile monitoring --profile headless-render"; do
            # shellcheck disable=SC2086 # word splitting of the profile flags is intended
            docker compose -p postmind-studio -f deploy/vps/compose.yml \
              --env-file "$STUDIO_ENV_FILE" --env-file "$STUDIO_BACKUP_ENV_FILE" $profiles config --quiet
          done
          docker compose -p postmind-edge -f deploy/vps/compose.edge.yml --env-file "$STUDIO_ENV_FILE" config --quiet
      - name: caddy validate (Caddyfile + a site rendered like deploy.sh does)
        run: |
          mkdir -p "$RUNNER_TEMP/sites"
          sed -e 's|__DOMAIN__|studio.ci.invalid|g' -e 's|__ENV__|production|g' \
            -e 's|__INTERNAL_CIDRS__|203.0.113.10/32 2001:db8::/32|g' \
            deploy/vps/caddy/site.caddy.tmpl > "$RUNNER_TEMP/sites/production.caddy"
          sed -e '/not client_ip __INTERNAL_CIDRS__/d' -e 's|__DOMAIN__|staging.ci.invalid|g' \
            -e 's|__ENV__|staging|g' deploy/vps/caddy/site.caddy.tmpl > "$RUNNER_TEMP/sites/staging.caddy"
          docker run --rm -e ACME_EMAIL=ci@example.com -e CADDY_TRUSTED_PROXIES=127.0.0.1/32 \
            -v "$PWD/deploy/vps/caddy:/etc/caddy:ro" -v "$RUNNER_TEMP/sites:/etc/caddy-sites:ro" \
            caddy:2.11.4-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: promtool check config (deploy/vps/prometheus/prometheus.yml)
        run: |
          printf 'ci-placeholder' > "$RUNNER_TEMP/metrics-token"
          docker run --rm \
            -v "$PWD/deploy/vps/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/ops/prometheus/studio-alerts.yml:/etc/prometheus/rules/studio-alerts.yml:ro" \
            -v "$PWD/ops/prometheus/studio-slo.yml:/etc/prometheus/rules/studio-slo.yml:ro" \
            -v "$RUNNER_TEMP/metrics-token:/etc/prometheus/secrets/metrics-token:ro" \
            --entrypoint promtool prom/prometheus:v2.55.1 check config /etc/prometheus/prometheus.yml

  publish-image:
    # Deployment: single VPS — the server pulls ghcr.io/infoworksdomain-blip/postmind-studio:<sha>.
    # Only main, only after every check passed. GitHub's documented GHCR flow
    # (https://docs.github.com/en/actions/tutorials/publish-packages/publish-docker-images, read
    # 2026-09-29): GITHUB_TOKEN with packages: write, then an artifact attestation (actions/attest,
    # push-to-registry) that `gh attestation verify oci://… --owner infoworksdomain-blip` checks.
    # BuildKit provenance mode=max is attached as well
    # (https://docs.docker.com/build/ci/github-actions/attestations/).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, database, ops-config, docker, vps-config]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      IMAGE: ghcr.io/infoworksdomain-blip/postmind-studio
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (tag = commit SHA)
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Artifact attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
