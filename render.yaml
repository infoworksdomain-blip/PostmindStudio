# PostMind Studio — Render Blueprint (runbooks/render-deploy.md). One Render project, two
# environments (staging, production), everything in region frankfurt (EU data residency; files
# stay in Cloudflare R2 with the EU jurisdiction, envelope keys in AWS KMS).
# Spec: https://render.com/docs/blueprint-spec (read 2026-09-28). Validate before pushing:
#   render blueprints validate render.yaml
# Tested by test/unit/render-blueprint.test.ts.
#
# Per environment:
#   studio-db-<env>        Render Postgres 17 (pgvector is supported on PG 13+,
#                          https://render.com/docs/postgresql-extensions; the first migration runs
#                          CREATE EXTENSION vector), private network only.
#   studio-kv-<env>        Render Key Value (Valkey 8), noeviction (BullMQ requires it:
#                          https://docs.bullmq.io/guide/going-to-production), journal+snapshot
#                          persistence, no external access. Studio selects DB 3 itself.
#   studio-web-<env>       Next.js (API + UI). preDeployCommand = migrations + idempotent seed.
#   studio-worker-*-<env>  one PRIVATE SERVICE per BullMQ queue. Not `worker`: background
#                          workers cannot receive private-network traffic, so Prometheus could not
#                          scrape their :9464/metrics (https://render.com/docs/private-network).
#                          A private service must bind a port, which the metrics listener does
#                          (METRICS_TOKEN is always set, from studio-metrics-<env>).
#   studio-monitoring-<env> Prometheus + Alertmanager + blackbox exporter (ops/render/monitoring).
#   studio-backup-storage-<env> daily CRON job (03:30 UTC): backup copy of the R2 buckets
#                          (scripts/ops/backup-storage.ts, runbooks/backup-recovery.md).
# The headless render service (docker-compose.prod.yml `browserless`) is NOT included: see
# runbooks/render-deploy.md "Not on Render".
#
# Environment groups per environment:
#   studio-config-<env>   non-secret configuration (literal values, in git).
#   studio-metrics-<env>  METRICS_TOKEN, generated by Render once and shared by web, workers and
#                         Prometheus.
#   studio-secrets-<env>  EMPTY here on purpose. A Blueprint cannot prompt for values in a group
#                         (`sync: false` is ignored in groups), and prompting on each service
#                         would mean pasting every secret seven times. The operator pastes them
#                         ONCE per environment into this group in the dashboard ("Add from .env");
#                         all seven app services and the backup cron job link it. Render keeps
#                         env vars that the Blueprint does not list. Table of keys:
#                         runbooks/render-deploy.md.
# Render does not interpolate variables in a Blueprint, so DATABASE_URL is built at start-up by
# scripts/render/with-db-url.sh (schema=studio + per-service pool size) from RENDER_POSTGRES_URL.
#
# Rough monthly cost (USD, https://render.com/pricing read 2026-09-28; compute is prorated by the
# second; bandwidth beyond the included 5 GB is $0.15/GB; build pipeline minutes beyond the plan
# allowance are $5 per 1,000 — each service builds the image itself):
#   staging     Postgres 0.5c-1g $19 + 5 GB $1.50 · Key Value 256mb $10 · web 1c-2g $25 ·
#               assets 1c-2g $25 · 5 workers 0.5c-512mb 5×$7 · monitoring 0.5c-512mb $7 + 5 GB
#               disk $1.25                                                     ≈ $124/month
#   production  Postgres 2c-8g $100 + 20 GB $6 · Key Value 1g $32 · web 2×1c-2g $50 ·
#               orchestration 2×1c-2g $50 · assets 2×1c-2g $50 · publish 2×1c-2g $50 ·
#               library 1c-2g $25 · scheduled + analytics 2×0.5c-512mb $14 · monitoring
#               0.5c-512mb $7 + 10 GB disk $2.50                               ≈ $387/month
#   backup cron prorated by the second ($0.00016/min 0.5c-512mb staging, $0.00058/min 1c-2g
#               production): well under $1/month each at tens of minutes a day.
#   workspace   Pro $25/month (7-day Postgres PITR instead of 3, network-isolated environments).
#               Total ≈ $536/month before bandwidth and build minutes.
# Postgres connections (plan limits: 0.5c-1g 100, 2c-8g 200, https://render.com/pricing):
# STUDIO_DB_CONNECTION_LIMIT x instances sums to 36 (staging) / 59 (production), plus 8 for the
# pre-deploy migration, and old + new instances overlap during a deploy, so production uses the
# 200-connection plan. Pools open lazily; the limits are ceilings.

projects:
  - name: postmind-studio
    environments:
      # =========================================================================================
      # STAGING — auto-deploys main after CI passes.
      # =========================================================================================
      - name: staging
        networking:
          isolation: enabled # no private traffic between staging and production (Pro workspace)
        databases:
          - name: studio-db-staging
            postgresMajorVersion: '17'
            region: frankfurt
            plan: 0.5c-1g
            diskSizeGB: 5
            databaseName: postmind_studio
            user: studio
            ipAllowList: [] # private network only; use the web service Shell for psql/prisma
        envVarGroups:
          - name: studio-config-staging
            envVars:
              - key: NODE_ENV
                value: production
              - key: STORAGE_PROVIDER
                value: r2
              - key: R2_JURISDICTION
                value: eu
              # Buckets of the GitHub `staging` environment (runbooks/r2-setup.md).
              - key: S3_BUCKET_ASSETS
                value: studio1eu
              - key: S3_BUCKET_RENDERS
                value: eustudio2
              - key: S3_BUCKET_THUMBNAILS
                value: eustudio3
              - key: S3_BUCKET_LIBRARY
                value: eustudio4
              - key: WORKER_METRICS_PORT
                value: '9464'
              - key: BULLMQ_QUEUE_PREFIX
                value: studio
              - key: STUDIO_DB_POOL_TIMEOUT
                value: '20'
              - key: LOG_LEVEL
                value: info
              - key: SENTRY_ENVIRONMENT
                value: staging
              # .env.example default; review with finance (providers/pricing.ts).
              - key: STUDIO_USD_TO_GBP_RATE
                value: '0.75'
          - name: studio-metrics-staging
            envVars:
              - key: METRICS_TOKEN
                generateValue: true
          - name: studio-secrets-staging
            envVars: [] # filled in the dashboard — runbooks/render-deploy.md step 4
        services:
          - type: keyvalue
            name: studio-kv-staging
            region: frankfurt
            plan: 256mb
            maxmemoryPolicy: noeviction
            persistenceMode: journal-snapshot
            ipAllowList: [] # private network only

          - type: web
            name: studio-web-staging
            runtime: docker
            dockerfilePath: ./Dockerfile
            region: frankfurt
            plan: 1c-2g
            numInstances: 1
            autoDeployTrigger: checksPass
            healthCheckPath: /api/health/ready
            maxShutdownDelaySeconds: 60
            preDeployCommand: sh scripts/render/with-db-url.sh sh scripts/render/migrate.sh
            dockerCommand: sh scripts/render/with-db-url.sh npx next start -p 3010
            envVars:
              - fromGroup: studio-config-staging
              - fromGroup: studio-metrics-staging
              - fromGroup: studio-secrets-staging
              - key: PORT
                value: '3010'
              - key: RENDER_POSTGRES_URL
                fromDatabase:
                  name: studio-db-staging
                  property: connectionString
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: studio-kv-staging
                  property: connectionString
              - key: STUDIO_DB_CONNECTION_LIMIT
                value: '8'
              # Inbound token PostMind Core sends to /api/studio/internal/** (≥ 32 chars). Studio
              # owns it: copy it from the dashboard into Core's configuration.
              - key: STUDIO_INTERNAL_SERVICE_TOKEN
                generateValue: true

          - type: pserv
            name: studio-worker-orchestration-staging
            runtime: docker
            dockerfilePath: ./Dockerfile
            region: frankfurt
            plan: 0.5c-512mb
            numInstances: 1
            autoDeployTrigger: checksPass
            maxShutdownDelaySeconds: 120
            dockerCommand: sh scripts/render/with-db-url.sh npx tsx scripts/worker.ts studio-orchestration
            envVars:
              - fromGroup: studio-config-staging
              - fromGroup: studio-metrics-staging
              - fromGroup: studio-secrets-staging
              - key: RENDER_POSTGRES_URL
                fromDatabase:
                  name: studio-db-staging
                  property: connectionString
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: studio-kv-staging
                  property: connectionString
              - key: STUDIO_DB_CONNECTION_LIMIT
                value: '5'

          - type: pserv
            name: studio-worker-assets-staging
            runtime: docker
            dockerfilePath: ./Dockerfile
            region: frankfurt
            plan: 1c-2g
            numInstances: 1
            autoDeployTrigger: checksPass
            maxShutdownDelaySeconds: 120
            dockerCommand: sh scripts/render/with-db-url.sh npx tsx scripts/worker.ts studio-assets
            envVars:
              - fromGroup: studio-config-staging
              - fromGroup: studio-metrics-staging
              - fromGroup: studio-secrets-staging
              - key: RENDER_POSTGRES_URL
                fromDatabase:
                  name: studio-db-staging
                  property: connectionString
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: studio-kv-staging
                  property: connectionString
              - key: STUDIO_DB_CONNECTION_LIMIT
                value: '5'

          - type: pserv
            name: studio-worker-publish-staging
            runtime: docker
            dockerfilePath: ./Dockerfile
            region: frankfurt
            plan: 0.5c-512mb
            numInstances: 1
            autoDeployTrigger: checksPass
            maxShutdownDelaySeconds: 120
            dockerCommand: sh scripts/render/with-db-url.sh npx tsx scripts/worker.ts studio-publish
            envVars:
              - fromGroup: studio-config-staging
              - fromGroup: studio-metrics-staging
              - fromGroup: studio-secrets-staging
              - key: RENDER_POSTGRES_URL
                fromDatabase:
                  name: studio-db-staging
                  property: connectionString
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: studio-kv-staging
                  property: connectionString
              - key: STUDIO_DB_CONNECTION_LIMIT
                value: '5'

          - type: pserv
            name: studio-worker-scheduled-staging
            runtime: docker
            dockerfilePath: ./Dockerfile
            region: frankfurt
            plan: 0.5c-512mb
            numInstances: 1
            autoDeployTrigger: checksPass
            maxShutdownDelaySeconds: 120
            dockerCommand: sh scripts/render/with-db-url.sh npx tsx scripts/worker.ts studio-scheduled
            envVars:
              - fromGroup: studio-config-staging
              - fromGroup: studio-metrics-staging
              - fromGroup: studio-secrets-staging
              - key: RENDER_POSTGRES_URL
                fromDatabase:
                  name: studio-db-staging
                  property: connectionString
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: studio-kv-staging
                  property: connectionString
              - key: STUDIO_DB_CONNECTION_LIMIT
                value: '5'

          - type: pserv
            name: studio-worker-analytics-staging
            runtime: docker
            dockerfilePath: ./Dockerfile
            region: frankfurt
            plan: 0.5c-512mb
            numInstances: 1
            autoDeployTrigger: checksPass
            maxShutdownDelaySeconds: 120
            dockerCommand: sh scripts/render/with-db-url.sh npx tsx scripts/worker.ts studio-analytics
            envVars:
              - fromGroup: studio-config-staging
              - fromGroup: studio-metrics-staging
              - fromGroup: studio-secrets-staging
              - key: RENDER_POSTGRES_URL
                fromDatabase:
                  name: studio-db-staging
                  property: connectionString
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: studio-kv-staging
                  property: connectionString
              - key: STUDIO_DB_CONNECTION_LIMIT
                value: '5'

          - type: pserv
            name: studio-worker-library-staging
            runtime: docker
            dockerfilePath: ./Dockerfile
            region: frankfurt
            plan: 0.5c-512mb
            numInstances: 1
            autoDeployTrigger: checksPass
            maxShutdownDelaySeconds: 120
            dockerCommand: sh scripts/render/with-db-url.sh npx tsx scripts/worker.ts studio-library
            envVars:
              - fromGroup: studio-config-staging
              - fromGroup: studio-metrics-staging
              - fromGroup: studio-secrets-staging
              - key: RENDER_POSTGRES_URL
                fromDatabase:
                  name: studio-db-staging
                  property: connectionString
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: studio-kv-staging
                  property: connectionString
              - key: STUDIO_DB_CONNECTION_LIMIT
                value: '3'

          - type: pserv
            name: studio-monitoring-staging
            runtime: docker
            dockerfilePath: ./ops/render/monitoring/Dockerfile
            dockerContext: .
            region: frankfurt
            plan: 0.5c-512mb
            autoDeployTrigger: checksPass
            disk:
              name: monitoring-data
              mountPath: /data
              sizeGB: 5
            envVars:
              - fromGroup: studio-metrics-staging
              - key: STUDIO_ENVIRONMENT
                value: staging
              - key: PROMETHEUS_RETENTION
                value: 15d
              - key: PAGERDUTY_ROUTING_KEY
                sync: false
              - key: SLACK_WEBHOOK_URL
                sync: false
              - key: STUDIO_WEB_HOST
                fromService:
                  type: web
                  name: studio-web-staging
                  property: host
              - key: STUDIO_WORKER_ORCHESTRATION_HOST
                fromService:
                  type: pserv
                  name: studio-worker-orchestration-staging
                  property: host
              - key: STUDIO_WORKER_ASSETS_HOST
                fromService:
                  type: pserv
                  name: studio-worker-assets-staging
                  property: host
              - key: STUDIO_WORKER_PUBLISH_HOST
                fromService:
                  type: pserv
                  name: studio-worker-publish-staging
                  property: host
              - key: STUDIO_WORKER_SCHEDULED_HOST
                fromService:
                  type: pserv
                  name: studio-worker-scheduled-staging
                  property: host
              - key: STUDIO_WORKER_ANALYTICS_HOST
                fromService:
                  type: pserv
                  name: studio-worker-analytics-staging
                  property: host
              - key: STUDIO_WORKER_LIBRARY_HOST
                fromService:
                  type: pserv
                  name: studio-worker-library-staging
                  property: host

          # Phase 17.5 — daily backup copy of the assets, renders and thumbnails buckets into the
          # backup bucket, ageing out copies whose source was deleted > 30 days ago
          # (runbooks/backup-recovery.md). Object storage only: no database, so no with-db-url.sh.
          # Render runs at most one run at a time and stops a run after 12 hours; schedules are UTC
          # (https://render.com/docs/cronjobs, read 2026-09-28). A failed run (exit 1) shows as
          # failed in the dashboard and triggers the workspace's failure notifications.
          - type: cron
            name: studio-backup-storage-staging
            runtime: docker
            dockerfilePath: ./Dockerfile
            region: frankfurt
            plan: 0.5c-512mb
            schedule: '30 3 * * *'
            autoDeployTrigger: checksPass
            dockerCommand: npx tsx scripts/ops/backup-storage.ts --apply
            envVars:
              - fromGroup: studio-config-staging
              - fromGroup: studio-secrets-staging
              # The backup bucket (same account and EU jurisdiction: S3_BACKUP_REGION auto) and the
              # backup job's own R2 token: read on the live buckets, read & write on the backup
              # bucket. The app token has no access to the backup (runbooks/r2-setup.md).
              - key: S3_BACKUP_BUCKET
                sync: false
              - key: S3_BACKUP_REGION
                value: auto
              - key: S3_BACKUP_RETENTION_DAYS
                value: '30'
              - key: S3_BACKUP_ACCESS_KEY_ID
                sync: false
              - key: S3_BACKUP_SECRET_ACCESS_KEY
                sync: false

      # =========================================================================================
      # PRODUCTION — never auto-deploys. Promote the commit that passed on staging with
      # scripts/render/deploy.ts (runbooks/render-deploy.md step 8).
      # =========================================================================================
      - name: production
        networking:
          isolation: enabled
        permissions:
          protection: enabled # destructive actions need a workspace admin
        databases:
          - name: studio-db-production
            postgresMajorVersion: '17'
            region: frankfurt
            plan: 2c-8g
            diskSizeGB: 20
            storageAutoscalingEnabled: true
            databaseName: postmind_studio
            user: studio
            ipAllowList: []
        envVarGroups:
          - name: studio-config-production
            envVars:
              - key: NODE_ENV
                value: production
              - key: STORAGE_PROVIDER
                value: r2
              - key: R2_JURISDICTION
                value: eu
              # Production bucket names are not known yet: S3_BUCKET_* go into
              # studio-secrets-production (runbooks/render-deploy.md step 4).
              - key: WORKER_METRICS_PORT
                value: '9464'
              - key: BULLMQ_QUEUE_PREFIX
                value: studio
              - key: STUDIO_DB_POOL_TIMEOUT
                value: '20'
              - key: LOG_LEVEL
                value: info
              - key: SENTRY_ENVIRONMENT
                value: production
              - key: STUDIO_USD_TO_GBP_RATE
                value: '0.75'
          - name: studio-metrics-production
            envVars:
              - key: METRICS_TOKEN
                generateValue: true
          - name: studio-secrets-production
            envVars: []
        services:
          - type: keyvalue
            name: studio-kv-production
            region: frankfurt
            plan: 1g
            maxmemoryPolicy: noeviction
            persistenceMode: journal-snapshot
            ipAllowList: []

          - type: web
            name: studio-web-production
            runtime: docker
            dockerfilePath: ./Dockerfile
            region: frankfurt
            plan: 1c-2g
            numInstances: 2
            autoDeployTrigger: 'off'
            healthCheckPath: /api/health/ready
            maxShutdownDelaySeconds: 60
            preDeployCommand: sh scripts/render/with-db-url.sh sh scripts/render/migrate.sh
            dockerCommand: sh scripts/render/with-db-url.sh npx next start -p 3010
            envVars:
              - fromGroup: studio-config-production
              - fromGroup: studio-metrics-production
              - fromGroup: studio-secrets-production
              - key: PORT
                value: '3010'
              - key: RENDER_POSTGRES_URL
                fromDatabase:
                  name: studio-db-production
                  property: connectionString
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: studio-kv-production
                  property: connectionString
              - key: STUDIO_DB_CONNECTION_LIMIT
                value: '8'
              - key: STUDIO_INTERNAL_SERVICE_TOKEN
                generateValue: true

          - type: pserv
            name: studio-worker-orchestration-production
            runtime: docker
            dockerfilePath: ./Dockerfile
            region: frankfurt
            plan: 1c-2g
            numInstances: 2
            autoDeployTrigger: 'off'
            maxShutdownDelaySeconds: 120
            dockerCommand: sh scripts/render/with-db-url.sh npx tsx scripts/worker.ts studio-orchestration
            envVars:
              - fromGroup: studio-config-production
              - fromGroup: studio-metrics-production
              - fromGroup: studio-secrets-production
              - key: RENDER_POSTGRES_URL
                fromDatabase:
                  name: studio-db-production
                  property: connectionString
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: studio-kv-production
                  property: connectionString
              - key: STUDIO_DB_CONNECTION_LIMIT
                value: '5'

          - type: pserv
            name: studio-worker-assets-production
            runtime: docker
            dockerfilePath: ./Dockerfile
            region: frankfurt
            plan: 1c-2g
            numInstances: 2
            autoDeployTrigger: 'off'
            maxShutdownDelaySeconds: 120
            dockerCommand: sh scripts/render/with-db-url.sh npx tsx scripts/worker.ts studio-assets
            envVars:
              - fromGroup: studio-config-production
              - fromGroup: studio-metrics-production
              - fromGroup: studio-secrets-production
              - key: RENDER_POSTGRES_URL
                fromDatabase:
                  name: studio-db-production
                  property: connectionString
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: studio-kv-production
                  property: connectionString
              - key: STUDIO_DB_CONNECTION_LIMIT
                value: '5'

          - type: pserv
            name: studio-worker-publish-production
            runtime: docker
            dockerfilePath: ./Dockerfile
            region: frankfurt
            plan: 1c-2g
            numInstances: 2
            autoDeployTrigger: 'off'
            maxShutdownDelaySeconds: 120
            dockerCommand: sh scripts/render/with-db-url.sh npx tsx scripts/worker.ts studio-publish
            envVars:
              - fromGroup: studio-config-production
              - fromGroup: studio-metrics-production
              - fromGroup: studio-secrets-production
              - key: RENDER_POSTGRES_URL
                fromDatabase:
                  name: studio-db-production
                  property: connectionString
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: studio-kv-production
                  property: connectionString
              - key: STUDIO_DB_CONNECTION_LIMIT
                value: '5'

          - type: pserv
            name: studio-worker-scheduled-production
            runtime: docker
            dockerfilePath: ./Dockerfile
            region: frankfurt
            plan: 0.5c-512mb
            numInstances: 1
            autoDeployTrigger: 'off'
            maxShutdownDelaySeconds: 120
            dockerCommand: sh scripts/render/with-db-url.sh npx tsx scripts/worker.ts studio-scheduled
            envVars:
              - fromGroup: studio-config-production
              - fromGroup: studio-metrics-production
              - fromGroup: studio-secrets-production
              - key: RENDER_POSTGRES_URL
                fromDatabase:
                  name: studio-db-production
                  property: connectionString
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: studio-kv-production
                  property: connectionString
              - key: STUDIO_DB_CONNECTION_LIMIT
                value: '5'

          - type: pserv
            name: studio-worker-analytics-production
            runtime: docker
            dockerfilePath: ./Dockerfile
            region: frankfurt
            plan: 0.5c-512mb
            numInstances: 1
            autoDeployTrigger: 'off'
            maxShutdownDelaySeconds: 120
            dockerCommand: sh scripts/render/with-db-url.sh npx tsx scripts/worker.ts studio-analytics
            envVars:
              - fromGroup: studio-config-production
              - fromGroup: studio-metrics-production
              - fromGroup: studio-secrets-production
              - key: RENDER_POSTGRES_URL
                fromDatabase:
                  name: studio-db-production
                  property: connectionString
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: studio-kv-production
                  property: connectionString
              - key: STUDIO_DB_CONNECTION_LIMIT
                value: '5'

          - type: pserv
            name: studio-worker-library-production
            runtime: docker
            dockerfilePath: ./Dockerfile
            region: frankfurt
            plan: 1c-2g
            numInstances: 1
            autoDeployTrigger: 'off'
            maxShutdownDelaySeconds: 120
            dockerCommand: sh scripts/render/with-db-url.sh npx tsx scripts/worker.ts studio-library
            envVars:
              - fromGroup: studio-config-production
              - fromGroup: studio-metrics-production
              - fromGroup: studio-secrets-production
              - key: RENDER_POSTGRES_URL
                fromDatabase:
                  name: studio-db-production
                  property: connectionString
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: studio-kv-production
                  property: connectionString
              - key: STUDIO_DB_CONNECTION_LIMIT
                value: '3'

          - type: pserv
            name: studio-monitoring-production
            runtime: docker
            dockerfilePath: ./ops/render/monitoring/Dockerfile
            dockerContext: .
            region: frankfurt
            plan: 0.5c-512mb
            autoDeployTrigger: 'off'
            disk:
              name: monitoring-data
              mountPath: /data
              sizeGB: 10
            envVars:
              - fromGroup: studio-metrics-production
              - key: STUDIO_ENVIRONMENT
                value: production
              - key: PROMETHEUS_RETENTION
                value: 30d
              - key: PAGERDUTY_ROUTING_KEY
                sync: false
              - key: SLACK_WEBHOOK_URL
                sync: false
              - key: STUDIO_WEB_HOST
                fromService:
                  type: web
                  name: studio-web-production
                  property: host
              - key: STUDIO_WORKER_ORCHESTRATION_HOST
                fromService:
                  type: pserv
                  name: studio-worker-orchestration-production
                  property: host
              - key: STUDIO_WORKER_ASSETS_HOST
                fromService:
                  type: pserv
                  name: studio-worker-assets-production
                  property: host
              - key: STUDIO_WORKER_PUBLISH_HOST
                fromService:
                  type: pserv
                  name: studio-worker-publish-production
                  property: host
              - key: STUDIO_WORKER_SCHEDULED_HOST
                fromService:
                  type: pserv
                  name: studio-worker-scheduled-production
                  property: host
              - key: STUDIO_WORKER_ANALYTICS_HOST
                fromService:
                  type: pserv
                  name: studio-worker-analytics-production
                  property: host
              - key: STUDIO_WORKER_LIBRARY_HOST
                fromService:
                  type: pserv
                  name: studio-worker-library-production
                  property: host

          # Phase 17.5 — daily backup copy of the assets, renders and thumbnails buckets into the
          # backup bucket, ageing out copies whose source was deleted > 30 days ago
          # (runbooks/backup-recovery.md). Object storage only: no database, so no with-db-url.sh.
          # Render runs at most one run at a time and stops a run after 12 hours; schedules are UTC
          # (https://render.com/docs/cronjobs, read 2026-09-28). A failed run (exit 1) shows as
          # failed in the dashboard and triggers the workspace's failure notifications.
          - type: cron
            name: studio-backup-storage-production
            runtime: docker
            dockerfilePath: ./Dockerfile
            region: frankfurt
            plan: 1c-2g
            schedule: '30 3 * * *'
            autoDeployTrigger: 'off'
            dockerCommand: npx tsx scripts/ops/backup-storage.ts --apply
            envVars:
              - fromGroup: studio-config-production
              - fromGroup: studio-secrets-production
              # The backup bucket (same account and EU jurisdiction: S3_BACKUP_REGION auto) and the
              # backup job's own R2 token: read on the live buckets, read & write on the backup
              # bucket. The app token has no access to the backup (runbooks/r2-setup.md).
              - key: S3_BACKUP_BUCKET
                sync: false
              - key: S3_BACKUP_REGION
                value: auto
              - key: S3_BACKUP_RETENTION_DAYS
                value: '30'
              - key: S3_BACKUP_ACCESS_KEY_ID
                sync: false
              - key: S3_BACKUP_SECRET_ACCESS_KEY
                sync: false
