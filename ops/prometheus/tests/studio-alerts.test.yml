# promtool test rules ops/prometheus/tests/studio-alerts.test.yml (run in CI, ops-config job).
rule_files:
  - ../studio-alerts.yml

evaluation_interval: 1m

tests:
  # A web replica stops answering scrapes: pages after 2 minutes, not before.
  - interval: 1m
    input_series:
      - series: 'up{job="studio-web", instance="web-1:3010"}'
        values: '1 1 0 0 0 0'
    alert_rule_test:
      - eval_time: 3m
        alertname: StudioTargetDown
        exp_alerts: []
      - eval_time: 5m
        alertname: StudioTargetDown
        exp_alerts:
          - exp_labels:
              severity: page
              job: studio-web
              instance: web-1:3010
            exp_annotations:
              summary: 'Studio studio-web target web-1:3010 is down'
              description: 'Prometheus cannot scrape web-1:3010 for 2 minutes.'
              runbook_url: https://github.com/infoworksdomain-blip/PostmindStudio/blob/main/runbooks/service-health.md#target-down

  # The first global cost alert of a process (series pre-created at 0 by metrics.ts) pages, and
  # the alert clears once the 15-minute window has passed.
  - interval: 1m
    input_series:
      - series: 'studio_cost_alerts_total{job="studio-worker", instance="worker-1:9464", scope="global_daily", threshold="80"}'
        values: '0 0 0 1+0x30'
      - series: 'studio_cost_alerts_total{job="studio-worker", instance="worker-1:9464", scope="org_daily", threshold="80"}'
        values: '0+0x33'
    alert_rule_test:
      - eval_time: 2m
        alertname: StudioGlobalCostCap
        exp_alerts: []
      - eval_time: 5m
        alertname: StudioGlobalCostCap
        exp_alerts:
          - exp_labels:
              severity: page
              threshold: '80'
            exp_annotations:
              summary: 'Global daily provider spend crossed 80% of STUDIO_GLOBAL_DAILY_CAP_PENCE'
              description: 'At 100% all generation pauses until midnight UTC.'
              runbook_url: https://github.com/infoworksdomain-blip/PostmindStudio/blob/main/runbooks/cost-runaway.md#global-cap
      - eval_time: 5m
        alertname: StudioCostCapWarning
        exp_alerts:
          - exp_labels:
              severity: ticket
              scope: global_daily
            exp_annotations:
              summary: 'A global_daily cost cap crossed 80%'
              description: 'See Admin Centre → Cost report → Caps today for the organisation / project.'
              runbook_url: https://github.com/infoworksdomain-blip/PostmindStudio/blob/main/runbooks/cost-runaway.md
      - eval_time: 30m
        alertname: StudioGlobalCostCap
        exp_alerts: []

  # 1 in 4 jobs failing after retries pages once it has lasted 10 minutes.
  - interval: 1m
    input_series:
      - series: 'studio_jobs_total{job="studio-worker", instance="worker-1:9464", exported_job="plan-project", outcome="failed"}'
        values: '0+1x40'
      - series: 'studio_jobs_total{job="studio-worker", instance="worker-1:9464", exported_job="plan-project", outcome="succeeded"}'
        values: '0+3x40'
      - series: 'studio_jobs_total{job="studio-worker", instance="worker-1:9464", exported_job="plan-project", outcome="retrying"}'
        values: '0+50x40'
    alert_rule_test:
      - eval_time: 5m
        alertname: StudioJobFailureRateHigh
        exp_alerts: []
      - eval_time: 20m
        alertname: StudioJobFailureRateHigh
        exp_alerts:
          - exp_labels:
              severity: page
            exp_annotations:
              summary: 'Studio job failure rate 25% (> 5%)'
              description: 'More than 5% of queue jobs are failing after retries.'
              runbook_url: https://github.com/infoworksdomain-blip/PostmindStudio/blob/main/runbooks/service-health.md#job-failures

  # BACKLOG 17.4: a provider breaker open (2) for more than 5 minutes is a warning; one that
  # half-opens in time is not.
  - interval: 1m
    input_series:
      - series: 'studio_provider_circuit_state{job="studio-worker", instance="worker-1:9464", provider="runway"}'
        values: '0 0 2+0x20'
      - series: 'studio_provider_circuit_state{job="studio-worker", instance="worker-1:9464", provider="luma"}'
        values: '0 2 2 2 1 0+0x17'
    alert_rule_test:
      - eval_time: 5m
        alertname: StudioProviderCircuitOpen
        exp_alerts: []
      - eval_time: 10m
        alertname: StudioProviderCircuitOpen
        exp_alerts:
          - exp_labels:
              severity: ticket
              provider: runway
            exp_annotations:
              summary: 'Circuit breaker open for runway'
              description: 'The router is skipping runway and using fallbacks.'
              runbook_url: https://github.com/infoworksdomain-blip/PostmindStudio/blob/main/runbooks/provider-outage.md#alerts

  # BACKLOG 17.4: runway passed over in 4 of every 5 routings that reach it warns after 10
  # minutes; luma switched off by the provider kill switch (provider_disabled) and heygen with
  # too few failovers (7.5 in 15 minutes) do not.
  - interval: 1m
    input_series:
      - series: 'studio_provider_passed_over_total{job="studio-worker", instance="worker-1:9464", provider="runway", reason="circuit_open"}'
        values: '0+4x40'
      - series: 'studio_provider_selected_total{job="studio-worker", instance="worker-1:9464", provider="runway"}'
        values: '0+1x40'
      - series: 'studio_provider_passed_over_total{job="studio-worker", instance="worker-1:9464", provider="luma", reason="provider_disabled"}'
        values: '0+5x40'
      - series: 'studio_provider_passed_over_total{job="studio-worker", instance="worker-1:9464", provider="heygen", reason="circuit_open"}'
        values: '0+0.5x40'
    alert_rule_test:
      - eval_time: 5m
        alertname: StudioProviderFailoverRateHigh
        exp_alerts: []
      - eval_time: 30m
        alertname: StudioProviderFailoverRateHigh
        exp_alerts:
          - exp_labels:
              severity: ticket
              provider: runway
            exp_annotations:
              summary: 'High failover rate for runway'
              description: 'More than 20% of the routing decisions that reached runway passed it over (circuit open, too slow or no cost estimate) for 10 minutes.'
              runbook_url: https://github.com/infoworksdomain-blip/PostmindStudio/blob/main/runbooks/provider-outage.md#alerts
