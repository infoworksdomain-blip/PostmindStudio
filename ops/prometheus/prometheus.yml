# PostMind Studio — Prometheus configuration (BACKLOG 14.3), deployed by
# docker-compose.monitoring.yml next to docker-compose.prod.yml (runbooks/monitoring-deploy.md).
# Validated in CI (ops-config job): promtool check config (prom/prometheus:v2.55.1, the same
# version the compose file runs).
#
# Scrape jobs match the names ops/prometheus/studio-alerts.yml expects:
#   studio-web        GET /api/metrics on every web replica          (Bearer METRICS_TOKEN)
#   studio-worker     GET :9464/metrics on every worker process       (Bearer METRICS_TOKEN)
#   studio-readiness  blackbox exporter http_2xx probe of /api/health/ready
# Replicas are discovered through Docker's embedded DNS (a scaled service name resolves to every
# replica's address), so `docker compose up --scale` needs no config change.
# No secret in this file: the metrics token is read from a mounted file.

global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    service: postmind-studio

rule_files:
  - /etc/prometheus/rules/studio-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: studio-web
    metrics_path: /api/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics-token
    dns_sd_configs:
      - names: ['web']
        type: A
        port: 3010
        refresh_interval: 30s

  # Workers expose /metrics only when METRICS_TOKEN is set (scripts/worker.ts, WORKER_METRICS_PORT).
  - job_name: studio-worker
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics-token
    dns_sd_configs:
      - names:
          - worker-orchestration
          - worker-assets
          - worker-publish
          - worker-scheduled
          - worker-analytics
          - worker-library
        type: A
        port: 9464
        refresh_interval: 30s

  # Blackbox exporter pattern: the target is the URL to probe, the exporter is the address.
  - job_name: studio-readiness
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://web:3010/api/health/ready']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']
